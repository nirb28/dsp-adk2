name: sb_metadata_search
description: Retrieve Starburst semantic context, tables, metrics, dimensions, and sample queries relevant to a BI question
type: function
module_path: app.tools.sb_tools
function_name: sb_metadata_search
parameters:
  - name: question
    type: string
    description: Natural language BI question
    required: true
  - name: plan
    type: object
    description: Optional structured planning output
    required: false
  - name: metadata_file
    type: string
    description: Optional metadata file name under data/sb/metadata
    required: false
  - name: include_live_schema
    type: boolean
    description: Whether to supplement curated metadata with live Starburst table discovery
    required: false
    default: false
  - name: catalog
    type: string
    description: Starburst catalog override
    required: false
  - name: schema
    type: string
    description: Starburst schema override
    required: false
metadata:
  category: starburst_bi
  phase: semantic_retrieval
